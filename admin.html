<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMINO - Admin Dashboard</title>
<style>
:root{--bg:#0f0c29;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--mint:#00ffcc;--purple:#6c5ce7;--pink:#ff007f;--muted:#aaa}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;padding:14px;color:#fff;background:linear-gradient(135deg,#0f0c29,#1b1b3a,#24243e)}
.app{max-width:760px;margin:auto}
.card{padding:16px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.input-group{margin-bottom:12px}.input-group label{display:block;margin-bottom:5px;color:#bbb;font-size:.85rem}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#17172c;color:white;outline:none}
.btn-action{width:100%;padding:12px;border:0;border-radius:10px;color:#061c19;background:linear-gradient(45deg,var(--mint),#6c5ce7);font-weight:800;cursor:pointer}
.btn-danger{background:#ff4757;color:#fff}
.row{display:flex;gap:10px}.row .input-group{flex:1}
h1,h2{color:var(--mint);margin-bottom:12px}
.item-box{padding:10px;margin-bottom:8px;background:rgba(0,0,0,.3);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#adminPanel{display:none}
</style>
</head>
<body>
<div class="app">

  <!-- Login Section -->
  <div id="loginCard" class="card" style="margin-top: 50px;">
    <h2>🔐 Admin Login</h2>
    <div class="input-group">
      <label>Admin PIN (Default: 1234)</label>
      <input id="adminPin" type="password" placeholder="PIN দিন">
    </div>
    <button class="btn-action" onclick="checkLogin()">লগইন করুন</button>
  </div>

  <!-- Admin Dashboard Panel -->
  <div id="adminPanel">
    <h1>⚡ AMINO Admin Dashboard</h1>
    
    <!-- Site Settings Control -->
    <div class="card">
      <h2>⚙️ সাইট সেটিংস ও নগদ নম্বর</h2>
      <div class="input-group"><label>ব্র্যান্ড নাম</label><input id="setBrand" type="text" value="AMINO"></div>
      <div class="input-group"><label>নগদ পার্সোনাল নম্বর</label><input id="setNagad" type="text" value="01333088194"></div>
      <div class="input-group"><label>পেমেন্ট নোটিশ / ইনফো</label><textarea id="setPayInfo">নগদ নম্বরে Send Money করার পর ট্রানজেকশন আইডি দিন।</textarea></div>
      <button class="btn-action" onclick="saveSettings()">সেটিংস সেভ করুন</button>
    </div>

    <!-- Add New Match -->
    <div class="card">
      <h2>➕ নতুন ম্যাচ যোগ করুন</h2>
      <div class="row">
        <div class="input-group"><label>গেমের নাম</label><select id="matchGame"><option>Ludo King</option><option>eFootball</option><option>PUBG Mobile</option><option>Free Fire</option></select></div>
        <div class="input-group"><label>মোড</label><input id="matchMode" type="text" placeholder="Classic / Clash Squad"></div>
      </div>
      <div class="row">
        <div class="input-group"><label>এন্ট্রি ফি (৳)</label><input id="matchEntry" type="number" placeholder="25"></div>
        <div class="input-group"><label>প্রাইজ মানি (৳)</label><input id="matchPrize" type="number" placeholder="45"></div>
      </div>
      <div class="row">
        <div class="input-group"><label>ফরম্যাট</label><input id="matchFormat" type="text" value="1 VS 1"></div>
        <div class="input-group"><label>প্লেয়ার স্লট</label><input id="matchPlayers" type="text" value="1/2"></div>
      </div>
      <button class="btn-action" onclick="addNewMatch()">ম্যাচ লাইভ করুন</button>
    </div>

    <!-- Existing Matches List -->
    <div class="card">
      <h2>📋 বিদ্যমান ম্যাচসমূহ</h2>
      <div id="adminMatchList"></div>
    </div>

    <!-- User Requests List -->
    <div class="card">
      <h2>📥 ডিপোজিট ও উইথড্র রিকোয়েস্ট</h2>
      <div id="adminRequestsList"></div>
    </div>

  </div>
</div>

<script>
const store={
  get(k,d){try{let v=localStorage.getItem('amino_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('amino_'+k,JSON.stringify(v))}catch(e){}}
};

function checkLogin(){
  const pin = document.getElementById('adminPin').value;
  if(pin === '1234'){
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAdminData();
  } else {
    alert('ভুল PIN! সঠিক PIN দিন (1234)।');
  }
}

function loadAdminData(){
  // Load settings
  let settings = store.get('settings', {});
  if(settings.brand) document.getElementById('setBrand').value = settings.brand;
  
  renderAdminMatches();
  renderAdminRequests();
}

function saveSettings(){
  let settings = store.get('settings', {});
  settings.brand = document.getElementById('setBrand').value;
  settings.nagadNum = document.getElementById('setNagad').value;
  settings.paymentInfo = document.getElementById('setPayInfo').value;
  store.set('settings', settings);
  alert('সেটিংস সফলভাবে আপডেট হয়েছে!');
}

function addNewMatch(){
  let matches = store.get('matches', []);
  let newM = {
    id: 'AM-' + Math.floor(100 + Math.random()*900),
    game: document.getElementById('matchGame').value,
    mode: document.getElementById('matchMode').value || 'Classic',
    entry: Number(document.getElementById('matchEntry').value) || 20,
    prize: Number(document.getElementById('matchPrize').value) || 35,
    format: document.getElementById('matchFormat').value || '1 VS 1',
    players: document.getElementById('matchPlayers').value || '1/2'
  };
  matches.unshift(newM);
  store.set('matches', matches);
  renderAdminMatches();
  alert('নতুন ম্যাচ সফলভাবে যোগ করা হয়েছে!');
}

function deleteMatch(id){
  let matches = store.get('matches', []);
  matches = matches.filter(m => m.id !== id);
  store.set('matches', matches);
  renderAdminMatches();
}

function renderAdminMatches(){
  let matches = store.get('matches', []);
  let el = document.getElementById('adminMatchList');
  el.innerHTML = matches.length ? matches.map(m => `
    <div class="item-box">
      <div><strong>${m.game} (${m.mode})</strong><br><small>Entry: ${m.entry}৳ | Prize: ${m.prize}৳</small></div>
      <button class="btn-action btn-danger" style="width:auto; padding:6px 12px;" onclick="deleteMatch('${m.id}')">ডিলিট</button>
    </div>
  `).join('') : '<p style="color:#aaa">কোনো ম্যাচ নেই।</p>';
}

function renderAdminRequests(){
  let reqs = store.get('requests', []);
  let el = document.getElementById('adminRequestsList');
  el.innerHTML = reqs.length ? reqs.map((r, i) => `
    <div class="item-box">
      <div><strong>${r.title}</strong> - ${r.amount}৳<br><small>Phone: ${r.phone || 'N/A'} | Trx: ${r.trx || 'N/A'} | Status: ${r.status}</small></div>
    </div>
  `).join('') : '<p style="color:#aaa">কোনো রিকোয়েস্ট নেই।</p>';
}
</script>
</body>
</html>
